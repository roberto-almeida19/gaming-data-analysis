version: 2

models:
  - name: int_games_genres
    description: >
      Tabela ponte jogo x gênero. Explode a coluna `genres` de stg_games
      (lista separada por vírgula) em uma linha por par (app_id, genre).
      Jogos sem gênero ficam de fora.
    data_tests:
      - unique:
          column_name: "app_id || '|' || genre"
    columns:
      - name: app_id
        description: "ID do jogo na Steam."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_games')
                field: app_id
      - name: genre
        description: "Nome do gênero, sem espaços nas pontas."
        data_tests:
          - not_null

  - name: int_games_publishers
    description: >
      Tabela ponte jogo x publisher. Explode a coluna `publishers` de stg_games
      (lista separada por vírgula) em uma linha por par (app_id, publisher).
      Jogos sem publisher ficam de fora.
    data_tests:
      - unique:
          column_name: "app_id || '|' || publisher"
    columns:
      - name: app_id
        description: "ID do jogo na Steam."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_games')
                field: app_id
      - name: publisher
        description: "Nome da publisher, sem espaços nas pontas."
        data_tests:
          - not_null

  - name: int_games_developers
    description: >
      Game x developer bridge table. Explodes the comma-separated `developers`
      column of stg_games into one row per (app_id, developer). Games without
      a developer are excluded.
    data_tests:
      - unique:
          column_name: "app_id || '|' || developer"
    columns:
      - name: app_id
        description: "Steam game ID."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_games')
                field: app_id
      - name: developer
        description: "Developer name, trimmed. A comma followed by a space is kept as part of the name (e.g. 'CyberStep, Inc.')."
        data_tests:
          - not_null

  - name: int_games_tags
    description: >
      Game x tag bridge table. Explodes the comma-separated `tags` column of
      stg_games into one row per (app_id, tag_position), keeping the 1-based
      position of each tag in the source list (Steam orders tags by votes).
      Games without tags are excluded.
    data_tests:
      - unique:
          column_name: "app_id || '|' || tag_position"
    columns:
      - name: app_id
        description: "Steam game ID."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_games')
                field: app_id
      - name: tag
        description: "Tag name, trimmed."
        data_tests:
          - not_null
      - name: tag_position
        description: "1-based position of the tag in the source list."
        data_tests:
          - not_null
